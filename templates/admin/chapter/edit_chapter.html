<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Chapter</title>
</head>
<body>
    <h1>Edit Chapter</h1>

    <form action="{{ url_for('update_chapter', chapter_id=chapter.id) }}" method="POST">
        <label for="title">Chapter Title:</label>
        <input type="text" id="title" name="title" value="{{ chapter.title }}" required>

        <input type="hidden" name="subject_id" value="{{ chapter.subject_id }}">

        <button type="submit">Update Chapter</button>
    </form>

    <a href="{{ url_for('get_subject', subject_id=chapter.subject_id) }}">Back to Subject</a>
</body>
</html>
