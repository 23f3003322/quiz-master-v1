<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin-style.css') }}">
  <style>
    /* Custom CSS to ensure flash messages appear below navbar */


  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Navbar fixed at the top -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
      <!-- Brand -->
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('admin.admin_dash') }}">
        <i class="bi bi-shield-fill-check me-2 text-primary"></i>
        <span class="fw-bold">Admin Dashboard</span>
      </a>
      
      <!-- Responsive Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"
              aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <!-- Navbar Content -->
      <div class="collapse navbar-collapse" id="adminNavbar">
        <!-- Left Navigation Links -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('admin.admin_dash') }}">
              <i class="bi bi-house-door-fill me-1"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('admin.summary') }}">
              <i class="bi bi-graph-up-arrow me-1"></i> Summary
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" href="{{ url_for('admin.get_users') }}">
              <i class="bi bi-people-fill me-1"></i> Users
            </a>
          </li>
        </ul>
        
        <!-- Enhanced Search Form with Dropdown -->
        <div class="d-flex flex-grow-1 justify-content-center mx-lg-3 my-2 my-lg-0">
          <form class="d-flex w-100 max-w-md" action="{{ url_for('admin.search') }}" method="GET">
            <div class="input-group">
              <!-- Category Dropdown -->
              <select class="form-select flex-shrink-1 bg-light border-end-0" name="key" style="max-width: 130px;">
                <option value="users" selected>Users</option>
                <option value="subjects">Subjects</option>
                <option value="chapters">Chapters</option>
                <option value="quizzes">Quizzes</option>
                <option value="questions">Questions</option>
              </select>
              
              <!-- Search Input -->
              <input class="form-control bg-light" type="search"
                    placeholder="Search..."
                    aria-label="Search"
                    name="search_word">
                    
              <!-- Search Button -->
              <button class="btn btn-primary" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>
        </div>
        
        <!-- Logout Button -->
        <div class="navbar-nav">
          <a class="nav-link d-flex align-items-center text-danger" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>
  
  <!-- Content wrapper after navbar -->
  <div class="main-content-wrapper">
    <div class="container">
      <!-- Flash Messages Container -->
      <div class="flash-container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category or 'info' }} alert-dismissible fade show flash-message shadow-sm" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
      </div>
      
      <!-- Main content block -->
      {% block content %}{% endblock %}
    </div>
  </div>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Highlight current page in navbar
      const currentPath = window.location.pathname;
      const navLinks = document.querySelectorAll('.nav-link');
      
      navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
          link.classList.add('active');
        }
      });
      
      // Auto-dismiss flash messages after 5 seconds
      const flashMessages = document.querySelectorAll('.flash-message');
      
      flashMessages.forEach(message => {
        setTimeout(() => {
          const bsAlert = bootstrap.Alert.getOrCreateInstance(message);
          bsAlert.close();
        }, 5000);
      });
    });
  </script>
</body>
</html>
