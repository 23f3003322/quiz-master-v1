<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .flash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1050;
        }
        .flash-message {
            text-align: center;
            padding: 15px;
            transition: all 0.5s ease;
        }
        .alert-dismissible .btn-close {
            padding: 0.5rem 1rem;
        }

        .admin-navbar {
            background-color: #2c3e50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .admin-navbar .navbar-brand {
            color: #ecf0f1;
            font-weight: bold;
        }
        .admin-navbar .nav-link {
            color: #bdc3c7;
            transition: all 0.3s ease;
        }
        .admin-navbar .nav-link:hover {
            color: #ffffff;
            transform: scale(1.05);
        }
        .admin-navbar .nav-link.active {
            color: #3498db;
            font-weight: bold;
        }
        .admin-search-form .form-control {
            background-color: #34495e;
            border: none;
            color: #ecf0f1;
        }
        .admin-search-form .form-control::placeholder {
            color: #bdc3c7;
        }
        .admin-search-form .btn {
            background-color: #3498db;
            color: white;
            border: none;
        }
        .admin-dropdown .dropdown-menu {
            background-color: #2c3e50;
            border: none;
        }
        .admin-dropdown .dropdown-item {
            color: #ecf0f1;
        }
        .admin-dropdown .dropdown-item:hover {
            background-color: #34495e;
            color: #ffffff;
        }
        .admin-icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar">
        <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" href="{{ url_for('admin.admin_dash') }}">
                <i class="bi bi-shield-fill-check admin-icon"></i> Admin Dashboard
            </a>
    
            <!-- Responsive Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="adminNavbar">
                <!-- Left Navigation Links -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.admin_dash') }}">
                            <i class="bi bi-house-fill admin-icon"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.admin_dash') }}">
                            <i class="bi bi-graph-up admin-icon"></i> Summary
                        </a>
                    </li>
                </ul>
    
                <!-- Search Form -->
                <form class="d-flex admin-search-form me-3" action="{{ url_for('admin.admin_dash') }}" method="GET">
                    <input class="form-control me-2" type="search" 
                           placeholder="Search users, quizzes..." 
                           aria-label="Search" 
                           name="query">
                    <button class="btn" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
    
                <!-- User Dropdown -->
                <ul class="navbar-nav admin-dropdown">
                    <li class="nav-item dropdown">
                        <ul class="dropdown-menu dropdown-menu-end">

                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}">
                                    <i class="bi bi-box-arrow-right admin-icon"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class='container'>

        <!-- Flash Messages Container -->
        <div class="flash-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category or 'info' }} alert-dismissible fade show flash-message" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
        </div>
        
        {% block content %}{% endblock %}
        
    </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Highlight current page in navbar
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-dismiss flash messages after 5 seconds
            const flashMessages = document.querySelectorAll('.flash-message');
            
            flashMessages.forEach(message => {
                setTimeout(() => {
                    const bsAlert = bootstrap.Alert.getOrCreateInstance(message);
                    bsAlert.close();
                }, 5000);
            });
        });
        </script>
</body>
</html>
